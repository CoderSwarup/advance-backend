version: '3.9'
name: advance-backend-local

services:
  # Log aggregation backend — receives pushed logs (winston-loki)
  loki:
    image: grafana/loki:3.5.7
    container_name: ${APP_NAME:-advance-backend}-loki
    command: -config.file=/etc/loki/local-config.yml
    ports:
      - '3100:3100'
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  # Metrics backend — scrapes the app's /metrics (winston → Loki is logs;
  # Prometheus is metrics)
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ${APP_NAME:-advance-backend}-prometheus
    ports:
      - '9090:9090'
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d # keep 30 days of metric samples
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Tracing backend — receives OTLP spans from the app (OpenTelemetry → Tempo)
  tempo:
    image: grafana/tempo:2.10.8
    container_name: ${APP_NAME:-advance-backend}-tempo
    ports:
      - '3200:3200' # query/ready API (Grafana datasource)
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP ← the app's trace exporter
    command: -config.file=/etc/tempo/config.yml
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  # Dashboard UI — datasources and dashboards pre-provisioned
  grafana:
    image: grafana/grafana:12.1.1
    container_name: ${APP_NAME:-advance-backend}-grafana
    ports:
      - '3000:3000' # Grafana UI — app runs on 8000, no conflict
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Serve the provisioned overview dashboard as the default home page
      # (used when the user has no personal home-dashboard preference).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/advance-backend-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
